name: Hotel Tonight
description: HotelTonight is a last-minute hotel booking service founded in 2010 in San Francisco and
  acquired by Airbnb in 2019 for a reported $400 million. Through its mobile app and website it offers
  curated same-day and near-term deals on boutique, independent, and chain hotels across thousands of
  cities worldwide, with more than 15 million app downloads. Its developer surface is a partner/agent-facing
  portal (api-docs.hoteltonight.com) rather than a publicly documented API; this profile is maintained
  in the API Evangelist network as an enrichment lead.
